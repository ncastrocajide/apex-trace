[project]
name = "apextrace"
version = "0.7.0"
description = "Source-agnostic race telemetry analysis: laps from F1 timing data, F1 25 and MoTeC exports through one engine, with a live-delta web app"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ncastrocajide" }]
dependencies = [
    "fastf1>=3.4",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
apextrace = "apextrace.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apextrace"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear traps,
# UP outdated idioms for the targeted Python version.
select = ["E", "F", "W", "I", "B", "UP"]
